name: Get Citation Data

on:
  push:
    paths:
      - "google_scholar_crawler/**"
      - ".github/workflows/google_scholar_crawler.yaml"
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Test Scholar profile parsing
        run: python -m unittest discover -s tests -p 'test_scholar_crawler.py'
      - name: Fetch Google Scholar statistics
        timeout-minutes: 1
        working-directory: google_scholar_crawler
        run: python -u main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Update statistics branch without rewriting its history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin google-scholar-stats
          stats_dir="$RUNNER_TEMP/scholar-stats"
          git worktree add --detach "$stats_dir" FETCH_HEAD
          cp google_scholar_crawler/results/gs_data.json "$stats_dir/"
          cp google_scholar_crawler/results/gs_data_shieldsio.json "$stats_dir/"
          git -C "$stats_dir" add gs_data.json gs_data_shieldsio.json
          if git -C "$stats_dir" diff --cached --quiet; then
            echo 'Citation data is unchanged.'
            exit 0
          fi
          git -C "$stats_dir" commit -m "Updated Citation Data"
          stats_commit="$(git -C "$stats_dir" rev-parse HEAD)"
          git push origin "$stats_commit:refs/heads/google-scholar-stats"
