name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install crawler dependencies in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/scholar-venv"
          "$RUNNER_TEMP/scholar-venv/bin/python" -m pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch Google Scholar statistics
        working-directory: google_scholar_crawler
        run: |
          test -n "$GOOGLE_SCHOLAR_ID" || { echo 'Configure the GOOGLE_SCHOLAR_ID repository secret.'; exit 1; }
          "$RUNNER_TEMP/scholar-venv/bin/python" main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Update statistics branch without rewriting its history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin google-scholar-stats
          stats_dir="$RUNNER_TEMP/scholar-stats"
          git worktree add --detach "$stats_dir" FETCH_HEAD
          cp google_scholar_crawler/results/gs_data.json "$stats_dir/"
          cp google_scholar_crawler/results/gs_data_shieldsio.json "$stats_dir/"
          git -C "$stats_dir" add gs_data.json gs_data_shieldsio.json
          if git -C "$stats_dir" diff --cached --quiet; then
            echo 'Citation data is unchanged.'
            exit 0
          fi
          git -C "$stats_dir" commit -m "Updated Citation Data"
          stats_commit="$(git -C "$stats_dir" rev-parse HEAD)"
          git push origin "$stats_commit:refs/heads/google-scholar-stats"
